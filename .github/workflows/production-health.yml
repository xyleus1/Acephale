name: Production health

on:
  deployment_status:
  schedule:
    - cron: "*/30 * * * *"
  workflow_run:
    workflows: ["Production database migration"]
    types: [completed]

permissions:
  contents: read

jobs:
  health:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment_status.environment, 'Production'))
    runs-on: ubuntu-latest
    steps:
      - name: Check production health
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          response="$(curl -fsS https://app.derya.ai/api/health -H "x-cron-secret: ${CRON_SECRET}")"
          status="$(jq -r '.status // "unknown"' <<<"${response}")"
          ok="$(jq -r '.ok // false' <<<"${response}")"
          echo "status=${status}"
          jq -r '.checks[]? | select(.ok != true) | "failed=\(.name): \(.detail // "no detail")"' <<<"${response}"
          if [ "${ok}" != "true" ]; then
            echo "Production health is not ready."
            exit 1
          fi
