name: Hourly Gmail sync

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Run Gmail sync and background drain
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "${CRON_SECRET}"
          curl --fail --show-error --silent --retry 2 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://www.derya.ai/api/cron/gmail-sync
          curl --fail --show-error --silent --retry 2 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://www.derya.ai/api/cron/background-jobs?limit=25"
