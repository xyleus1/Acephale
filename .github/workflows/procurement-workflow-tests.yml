name: Procurement workflow security

on:
  pull_request:
    paths:
      - ".github/workflows/procurement-workflow-tests.yml"
      - ".github/workflows/production-database-migration.yml"
      - ".github/workflows/production-bourne-ledger.yml"
      - "src/app/api/procurement/**"
      - "src/app/login/**"
      - "src/app/dashboard/supply-os/**"
      - "src/app/dashboard/workflow/**"
      - "src/lib/auth.ts"
      - "src/lib/password.ts"
      - "src/lib/procurement-**"
      - "src/lib/supply-os/guild**"
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - "scripts/procurement-workflow-database.test.ts"
      - "scripts/production-database-migration-contract.test.ts"
      - "scripts/production-bourne-ledger-contract.test.ts"
      - "scripts/procurement-conversation.test.ts"
      - "scripts/procurement-supplier-nudge.test.ts"
      - "scripts/supply-os-active-sourcing.test.ts"
      - "scripts/supply-os-deployment-boundary.test.ts"
      - "scripts/minimal-live-schema.test.ts"
      - "scripts/create-production-office.ts"
      - "scripts/unified-neon-cutover.test.ts"
      - "scripts/sql/procurement-**"
      - "scripts/sql/production-verification/**"
      - "scripts/sql/bourne-procurement-communication-ledger.sql"
      - "scripts/sql/derya-app-role.sql"
      - "scripts/sql/minimal-schema-**"
      - "scripts/workflow-dashboard.test.ts"
      - "scripts/workflow-guild2.test.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_OWNER_URL: postgresql://postgres:postgres@127.0.0.1:5432/derya_unified
      DATABASE_URL: postgresql://derya_app:app_test_password@127.0.0.1:5432/derya_unified?schema=public
      DATABASE_URL_UNPOOLED: postgresql://derya_app:app_test_password@127.0.0.1:5432/derya_unified?schema=public
      WORKFLOW_DATABASE_OWNER_URL: postgresql://postgres:postgres@127.0.0.1:5432/derya_unified
      WORKFLOW_DATABASE_URL: postgresql://dashboard_api:dashboard_test_password@workflow.invalid/neondb?sslmode=require
      WORKFLOW_DATABASE_TEST_URL: postgresql://dashboard_api:dashboard_test_password@127.0.0.1:5432/derya_unified?schema=public
      WORKFLOW_BOURNE_TEST_URL: postgresql://bourne_supply_chain:bourne_test_password@127.0.0.1:5432/derya_unified?schema=public
      LEGACY_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/derya_legacy_migration
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Provision disposable unified database
        run: |
          createdb -h 127.0.0.1 -U postgres derya_unified
          DATABASE_URL="$DATABASE_OWNER_URL" DATABASE_URL_UNPOOLED="$DATABASE_OWNER_URL" npx prisma migrate deploy
          psql "$WORKFLOW_DATABASE_OWNER_URL" --file=scripts/sql/procurement-workflow-test-schema.sql
          psql "$WORKFLOW_DATABASE_OWNER_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE dashboard_api LOGIN NOINHERIT PASSWORD 'dashboard_test_password';
          CREATE ROLE unsafe_bourne_parent NOLOGIN;
          CREATE ROLE bourne_supply_chain LOGIN INHERIT PASSWORD 'bourne_test_password';
          GRANT unsafe_bourne_parent TO bourne_supply_chain;
          SQL
          if psql "$WORKFLOW_DATABASE_OWNER_URL" \
            --file=scripts/sql/bourne-procurement-communication-ledger.sql \
            >/tmp/unsafe-bourne-ledger.log 2>&1; then
            echo 'Expected unsafe Bourne role provisioning to fail.' >&2
            exit 1
          fi
          cat /tmp/unsafe-bourne-ledger.log
          grep -q 'bourne_supply_chain has unsafe role attributes or memberships' \
            /tmp/unsafe-bourne-ledger.log
          psql "$WORKFLOW_DATABASE_OWNER_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          REVOKE unsafe_bourne_parent FROM bourne_supply_chain;
          DROP ROLE unsafe_bourne_parent;
          CREATE TABLE procurement_communication_messages (customer_id uuid);
          SQL
          if psql "$WORKFLOW_DATABASE_OWNER_URL" \
            --file=scripts/sql/bourne-procurement-communication-ledger.sql \
            >/tmp/unsafe-ledger-shape.log 2>&1; then
            echo 'Expected malformed ledger schema provisioning to fail.' >&2
            exit 1
          fi
          cat /tmp/unsafe-ledger-shape.log
          grep -q 'procurement communication columns are missing or unsafe' \
            /tmp/unsafe-ledger-shape.log
          psql "$WORKFLOW_DATABASE_OWNER_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          DROP TABLE procurement_communication_messages;
          GRANT CREATE ON DATABASE derya_unified TO dashboard_api, bourne_supply_chain;
          GRANT CREATE ON SCHEMA public TO dashboard_api, bourne_supply_chain;
          SQL
          psql "$WORKFLOW_DATABASE_OWNER_URL" \
            --file=scripts/sql/bourne-procurement-communication-ledger.sql
          for pass in 1 2; do
            psql "$WORKFLOW_DATABASE_OWNER_URL" --set=dashboard_api_password=dashboard_test_password --file=scripts/sql/procurement-dashboard-api.sql
          done
          psql "$WORKFLOW_DATABASE_OWNER_URL" --set=derya_app_password=app_test_password --file=scripts/sql/derya-app-role.sql
          ALLOW_PRODUCTION_OFFICE_SEED=1 \
            PRODUCTION_OFFICE_NAME=Dreamz \
            PRODUCTION_ADMIN_EMAIL=mert@usederya.com \
            PRODUCTION_ADMIN_PASSWORD=local-test-password-only \
            PRODUCTION_ADMIN_NAME=Mert \
            npm run seed:production-office
          psql "$WORKFLOW_DATABASE_OWNER_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "CompanyWorkflowAccount" (id, office_id, company_id, name)
          SELECT
            '33333333-3333-4333-8333-333333333333'::uuid,
            company."officeId",
            company.id,
            company.name
          FROM "Company" company
          WHERE company.name = 'Dreamz';
          INSERT INTO "CompanyContext" (
            id, "officeId", "companyId", kind, name, markdown,
            "processingState", payload, "createdAt", "updatedAt"
          )
          SELECT
            message.id,
            company."officeId",
            company.id,
            'MESSAGE',
            'Operator message.md',
            message.body,
            'READY',
            jsonb_build_object('role', 'OPERATOR'),
            now(),
            now()
          FROM "Company" company
          CROSS JOIN (VALUES
            ('roundtrip-message-1', 'First same-name message'),
            ('roundtrip-message-2', 'Second same-name message')
          ) message(id, body)
          WHERE company.name = 'Dreamz';
          SQL
          psql "$WORKFLOW_DATABASE_OWNER_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          UPDATE "User"
          SET "canViewWholeOffice" = false,
              role = 'EMPLOYEE',
              "isActive" = false,
              "passwordHash" = 'invalid'
          WHERE email = 'mert@usederya.com';
          UPDATE "SupplyWorkspace"
          SET name = 'Incorrect name', status = 'ARCHIVED', "archivedAt" = now()
          WHERE "externalKey" = 'production:primary';
          UPDATE "SupplyWorkspaceMember"
          SET role = 'VIEWER', "isActive" = false;
          SQL
          ALLOW_PRODUCTION_OFFICE_SEED=1 \
            PRODUCTION_OFFICE_NAME=Dreamz \
            PRODUCTION_ADMIN_EMAIL=mert@usederya.com \
            PRODUCTION_ADMIN_PASSWORD=rotated-local-test-password \
            PRODUCTION_ADMIN_NAME=Mert \
            npm run seed:production-office
          psql "$WORKFLOW_DATABASE_OWNER_URL" --set=derya_app_password=rotated_app_test_password --file=scripts/sql/derya-app-role.sql
          ALLOW_PRODUCTION_OFFICE_SEED=1 \
            DATABASE_URL=postgresql://derya_app:rotated_app_test_password@127.0.0.1:5432/derya_unified?schema=public \
            DATABASE_URL_UNPOOLED=postgresql://derya_app:rotated_app_test_password@127.0.0.1:5432/derya_unified?schema=public \
            PRODUCTION_OFFICE_NAME=Dreamz \
            PRODUCTION_ADMIN_EMAIL=mert@usederya.com \
            PRODUCTION_ADMIN_PASSWORD=rotated-local-test-password \
            PRODUCTION_ADMIN_NAME=Mert \
            npm run seed:production-office
          DATABASE_URL=postgresql://derya_app:rotated_app_test_password@127.0.0.1:5432/derya_unified?schema=public \
            DATABASE_URL_UNPOOLED=postgresql://derya_app:rotated_app_test_password@127.0.0.1:5432/derya_unified?schema=public \
            UNIFIED_NEON_TEST_PASSWORD=rotated-local-test-password \
            UNIFIED_NEON_TEST_CUSTOMER_ID=33333333-3333-4333-8333-333333333333 \
            NODE_OPTIONS='--conditions=react-server' node --import tsx scripts/unified-neon-cutover.test.ts
          psql "$WORKFLOW_DATABASE_OWNER_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT count(*) FROM "Office" WHERE name = 'Dreamz') <> 1
              OR (SELECT count(*) FROM "User" WHERE email = 'mert@usederya.com') <> 1
              OR (SELECT count(*) FROM "Company" WHERE name = 'Dreamz') <> 1
              OR (SELECT count(*) FROM "User" WHERE email = 'mert@usederya.com' AND role = 'ADMIN' AND "isActive" AND "canViewWholeOffice") <> 1
              OR (SELECT count(*) FROM "SupplyWorkspace" w JOIN "Company" c ON c.id = w."companyId" WHERE w."externalKey" = 'production:primary' AND w.name = 'Dreamz' AND w.status = 'ACTIVE' AND w."archivedAt" IS NULL AND w."officeId" = c."officeId") <> 1
              OR (SELECT count(*) FROM "SupplyWorkspaceMember" m JOIN "User" u ON u.id = m."userId" JOIN "SupplyWorkspace" w ON w.id = m."workspaceId" WHERE m.role = 'OWNER' AND m."isActive" AND m."officeId" = u."officeId" AND m."officeId" = w."officeId") <> 1
              OR has_table_privilege('dashboard_api', 'public."User"', 'SELECT')
              OR has_table_privilege('dashboard_api', 'public."User"', 'INSERT')
              OR has_table_privilege('derya_app', 'public.orders', 'SELECT')
              OR has_table_privilege('derya_app', 'public.orders', 'INSERT')
              OR has_table_privilege('derya_app', 'public.orders', 'UPDATE')
              OR has_table_privilege('derya_app', 'public.orders', 'DELETE') THEN
              RAISE EXCEPTION 'production identity seed is not idempotent';
            END IF;
          END
          $$;
          SQL
          psql "$WORKFLOW_DATABASE_OWNER_URL" --set=derya_app_password=app_test_password --file=scripts/sql/derya-app-role.sql
      - name: Rehearse populated legacy migration
        run: |
          createdb -h 127.0.0.1 -U postgres derya_legacy_migration
          find prisma/migrations -mindepth 2 -maxdepth 2 -name migration.sql -print0 \
            | sort -z \
            | while IFS= read -r -d '' migration; do
                if [[ "$migration" == *"20260821000100_minimal_customer_procurement_schema"* \
                  || "$migration" == *"20260822000300_customer_portal_context_access"* \
                  || "$migration" == *"20260822000200_order_supplier_contact_compatibility"* \
                  || "$migration" == *"20260822000500_procurement_workspace_context_relink"* ]]; then
                  continue
                fi
                psql "$LEGACY_MIGRATION_DATABASE_URL" --set=ON_ERROR_STOP=1 --file="$migration"
              done
          psql "$LEGACY_MIGRATION_DATABASE_URL" --file=scripts/sql/minimal-schema-legacy-fixture.sql
          createdb -h 127.0.0.1 -U postgres \
            -T derya_legacy_migration derya_legacy_unmatched
          createdb -h 127.0.0.1 -U postgres \
            -T derya_legacy_migration derya_legacy_ambiguous
          psql postgresql://postgres:postgres@127.0.0.1:5432/derya_legacy_unmatched \
            --set=ON_ERROR_STOP=1 <<'SQL'
          UPDATE "Company"
          SET name = 'No matching company'
          WHERE id = 'legacy-company';
          SQL
          psql postgresql://postgres:postgres@127.0.0.1:5432/derya_legacy_ambiguous \
            --set=ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "Office" (id, name, "createdAt", "updatedAt")
          VALUES ('legacy-ambiguous-office', 'Ambiguous office', now(), now());
          INSERT INTO "Company" (id, "officeId", name, status, "createdAt", "updatedAt")
          VALUES (
            'legacy-ambiguous-company', 'legacy-ambiguous-office', 'HypnoDreamz',
            'IN_PROGRESS', now(), now()
          );
          SQL
          if psql postgresql://postgres:postgres@127.0.0.1:5432/derya_legacy_unmatched \
            --set=ON_ERROR_STOP=1 \
            --file=prisma/migrations/20260821000100_minimal_customer_procurement_schema/migration.sql \
            >/tmp/derya-legacy-unmatched.log 2>&1; then
            echo 'Expected unmatched workflow customer migration to fail.' >&2
            exit 1
          fi
          cat /tmp/derya-legacy-unmatched.log
          grep -q 'Workflow customers do not map uniquely' /tmp/derya-legacy-unmatched.log
          if psql postgresql://postgres:postgres@127.0.0.1:5432/derya_legacy_ambiguous \
            --set=ON_ERROR_STOP=1 \
            --file=prisma/migrations/20260821000100_minimal_customer_procurement_schema/migration.sql \
            >/tmp/derya-legacy-ambiguous.log 2>&1; then
            echo 'Expected ambiguous workflow customer migration to fail.' >&2
            exit 1
          fi
          cat /tmp/derya-legacy-ambiguous.log
          grep -q 'Workflow customers do not map uniquely' /tmp/derya-legacy-ambiguous.log
          psql "$LEGACY_MIGRATION_DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=prisma/migrations/20260821000100_minimal_customer_procurement_schema/migration.sql
          psql "$LEGACY_MIGRATION_DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=prisma/migrations/20260822000300_customer_portal_context_access/migration.sql
          for pass in 1 2; do
            psql "$LEGACY_MIGRATION_DATABASE_URL" \
              --set=ON_ERROR_STOP=1 \
              --file=prisma/migrations/20260822000200_order_supplier_contact_compatibility/migration.sql
          done
          psql "$LEGACY_MIGRATION_DATABASE_URL" \
            --file=scripts/sql/procurement-workspace-relink-fixture.sql
          for pass in 1 2; do
            psql "$LEGACY_MIGRATION_DATABASE_URL" \
              --set=ON_ERROR_STOP=1 \
              --file=prisma/migrations/20260822000500_procurement_workspace_context_relink/migration.sql
          done
          psql "$LEGACY_MIGRATION_DATABASE_URL" \
            --file=scripts/sql/procurement-workspace-relink-verify.sql
          psql "$LEGACY_MIGRATION_DATABASE_URL" --file=scripts/sql/minimal-schema-legacy-verify.sql
      - name: Verify office export and repeat import
        run: |
          psql "$WORKFLOW_DATABASE_OWNER_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          UPDATE "Office"
          SET "pricingTargetMarginPct" = 12.5
          WHERE name = 'Dreamz';
          INSERT INTO "Office" (id, name, "createdAt", "updatedAt")
          VALUES
            ('cherry-pick-target', 'Cherry pick target', now(), now()),
            ('cherry-pick-second-hop', 'Cherry pick second hop', now(), now()),
            ('cherry-pick-legacy-v1', 'Cherry pick legacy v1', now(), now());
          INSERT INTO "Item" (
            id, office_id, company_id, material, sku, specification, created_at, updated_at
          )
          SELECT
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid,
            company."officeId",
            company.id,
            'Round-trip foam insert',
            'ROUNDTRIP-ITEM',
            '40 kg per cubic meter',
            now(),
            now()
          FROM "Company" company
          WHERE company.name = 'Dreamz';
          INSERT INTO "Supplier" (
            id, "officeId", name, "normalizedName", website, status, "createdAt", "updatedAt"
          )
          SELECT
            'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'::uuid,
            company."officeId",
            'Round-trip supplier',
            'round-trip supplier',
            'https://roundtrip.example',
            'VERIFIED',
            now(),
            now()
          FROM "Company" company
          WHERE company.name = 'Dreamz';
          INSERT INTO "CompanySupplier" (
            id, "officeId", "companyId", "supplierId", status, notes, "createdAt", "updatedAt"
          )
          SELECT
            'cccccccc-cccc-4ccc-8ccc-cccccccccccc'::uuid,
            company."officeId",
            company.id,
            'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'::uuid,
            'APPROVED',
            'Qualified for foam inserts.',
            now(),
            now()
          FROM "Company" company
          WHERE company.name = 'Dreamz';
          INSERT INTO "CompanyContext" (
            id, "officeId", "companyId", "itemId", kind, name, "storageUrl",
            "mimeType", "contentHash", markdown, "processingState", "createdAt", "updatedAt"
          )
          SELECT
            'roundtrip-context',
            company."officeId",
            company.id,
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid,
            'DOCUMENT',
            'foam-spec.md',
            'data:text/markdown;base64,IyBGb2FtIHNwZWM=',
            'text/markdown',
            'roundtrip-context-hash',
            '# Foam spec',
            'READY',
            now(),
            now()
          FROM "Company" company
          WHERE company.name = 'Dreamz';
          SQL
          OLD_DATABASE_URL="$WORKFLOW_DATABASE_OWNER_URL" \
            OLD_OFFICE_NAME=Dreamz \
            EXPORT_PATH=/tmp/derya-office-roundtrip.json \
            npm run export:office-cherry-pick
          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/derya-office-roundtrip.json', 'utf8'));
          delete payload.source.office.pricingTargetMarginPct;
          payload.data.marginProfiles = [{ marginPercent: 14 }, { marginPercent: 11.25 }];
          fs.writeFileSync('/tmp/derya-office-roundtrip-legacy-v1.json', JSON.stringify(payload));
          NODE
          DATABASE_URL="$WORKFLOW_DATABASE_OWNER_URL" \
            DATABASE_URL_UNPOOLED="$WORKFLOW_DATABASE_OWNER_URL" \
            TARGET_OFFICE_NAME='Cherry pick legacy v1' \
            IMPORT_PATH=/tmp/derya-office-roundtrip-legacy-v1.json \
            DRY_RUN=false \
            ALLOW_CHERRY_PICK_IMPORT=1 \
            npm run import:office-cherry-pick
          for pass in 1 2; do
            DATABASE_URL="$WORKFLOW_DATABASE_OWNER_URL" \
              DATABASE_URL_UNPOOLED="$WORKFLOW_DATABASE_OWNER_URL" \
              TARGET_OFFICE_NAME='Cherry pick target' \
              IMPORT_PATH=/tmp/derya-office-roundtrip.json \
              DRY_RUN=false \
              ALLOW_CHERRY_PICK_IMPORT=1 \
              npm run import:office-cherry-pick
          done
          OLD_DATABASE_URL="$WORKFLOW_DATABASE_OWNER_URL" \
            OLD_OFFICE_NAME='Cherry pick target' \
            EXPORT_PATH=/tmp/derya-office-roundtrip-second-hop.json \
            npm run export:office-cherry-pick
          DATABASE_URL="$WORKFLOW_DATABASE_OWNER_URL" \
            DATABASE_URL_UNPOOLED="$WORKFLOW_DATABASE_OWNER_URL" \
            TARGET_OFFICE_NAME='Cherry pick second hop' \
            IMPORT_PATH=/tmp/derya-office-roundtrip-second-hop.json \
            DRY_RUN=false \
            ALLOW_CHERRY_PICK_IMPORT=1 \
            npm run import:office-cherry-pick
          psql "$WORKFLOW_DATABASE_OWNER_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT "pricingTargetMarginPct" FROM "Office" WHERE id = 'cherry-pick-target') <> 12.5
              OR (SELECT "pricingTargetMarginPct" FROM "Office" WHERE id = 'cherry-pick-second-hop') <> 12.5
              OR (SELECT "pricingTargetMarginPct" FROM "Office" WHERE id = 'cherry-pick-legacy-v1') <> 11.25
              OR (
              SELECT count(*)
              FROM "Item" item
              JOIN "Company" company ON company.id = item.company_id
              WHERE item.office_id = 'cherry-pick-target'
                AND company."officeId" = item.office_id
                AND item.sku = 'ROUNDTRIP-ITEM'
            ) <> 1 OR (
              SELECT count(*)
              FROM "Supplier"
              WHERE "officeId" = 'cherry-pick-target'
                AND "normalizedName" = 'round-trip supplier'
            ) <> 1 OR (
              SELECT count(*)
              FROM "CompanySupplier" company_supplier
              JOIN "Company" company ON company.id = company_supplier."companyId"
              JOIN "Supplier" supplier ON supplier.id = company_supplier."supplierId"
              WHERE company_supplier."officeId" = 'cherry-pick-target'
                AND company."officeId" = company_supplier."officeId"
                AND supplier."officeId" = company_supplier."officeId"
            ) <> 1 OR (
              SELECT count(*)
              FROM "CompanyContext" context
              JOIN "Item" item ON item.id = context."itemId"
              WHERE context."officeId" = 'cherry-pick-target'
                AND item.office_id = context."officeId"
                AND context."storageUrl" = 'metadata-only://company-context/roundtrip-context'
                AND context."contentHash" IS NULL
                AND context.payload->'importSource'->>'contentHash' = 'roundtrip-context-hash'
                AND context.markdown = '# Foam spec'
            ) <> 1 OR NOT EXISTS (
              SELECT 1
              FROM "CompanyContext" context
              WHERE context."officeId" = 'cherry-pick-target'
                AND context.kind = 'MESSAGE'
                AND context.name = 'Operator message.md'
                AND context.payload->'importSource'->>'id' = 'roundtrip-message-1'
                AND context.markdown = 'First same-name message'
            ) OR NOT EXISTS (
              SELECT 1
              FROM "CompanyContext" context
              WHERE context."officeId" = 'cherry-pick-target'
                AND context.kind = 'MESSAGE'
                AND context.name = 'Operator message.md'
                AND context.payload->'importSource'->>'id' = 'roundtrip-message-2'
                AND context.markdown = 'Second same-name message'
            ) OR (
              SELECT count(*)
              FROM "CompanyContext" context
              JOIN "Item" item ON item.id = context."itemId"
              WHERE context."officeId" = 'cherry-pick-second-hop'
                AND item.office_id = context."officeId"
                AND context."storageUrl" LIKE 'metadata-only://company-context/%'
                AND context."contentHash" IS NULL
                AND context.payload->'importSource'->>'contentHash' = 'roundtrip-context-hash'
                AND context.markdown = '# Foam spec'
            ) <> 1 THEN
              RAISE EXCEPTION 'office export/import round trip is not scoped and idempotent';
            END IF;
          END
          $$;
          SQL
      - name: Run procurement security contracts
        run: |
          npm run test:production-database-migration
          npm run test:production-bourne-ledger
          npm run test:customer-portal
          npm run test:minimal-live-schema
          npm run test:procurement-conversation
          npm run test:procurement-workflow
          npm run test:supply-os-active-sourcing
          npm run test:procurement-file-draft-batch
          npm run test:procurement-autopilot-plan
          npm run test:procurement-supplier-nudge
          npm run test:procurement-supplier-quote-reading
          npm run test:procurement-request-document-merge
          npm run test:workflow-guild2
          npm run prebuild
          npm run test:procurement-workflow-db
          npm run test:customer-portal-password-db
          npm run test:customer-portal-account-admin-db
      - name: Run supplier reply delivery contracts
        env:
          SUPPLY_REPLY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/derya_supply_reply_verify_ci
        run: |
