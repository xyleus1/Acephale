name: Production connected email capability demo

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_DEMO_EMAIL_CAPABILITY_TEST
        required: true
        type: string
      inspection_job_id:
        description: Existing demo job ID for a read-only sanitized inspection
        required: false
        default: ""
        type: string
      reconciliation_job_id:
        description: Existing demo job ID for a no-send targeted IMAP reconciliation
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: production-demo-email-capability
  cancel-in-progress: false

jobs:
  run-demo:
    if: ${{ github.ref == 'refs/heads/main' && inputs.inspection_job_id == '' && inputs.reconciliation_job_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Production
    env:
      REQUEST_CONFIRMATION: ${{ inputs.confirmation }}
      PRODUCTION_APP_URL: https://app.derya.ai
      PGOPTIONS: -c lock_timeout=5000 -c statement_timeout=120000 -c idle_in_transaction_session_timeout=120000
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate demo request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REQUEST_CONFIRMATION" != "RUN_DEMO_EMAIL_CAPABILITY_TEST" ]]; then
            echo "The confirmation phrase is incorrect." >&2
            exit 1
          fi
          git ls-files --error-unmatch src/lib/demo-email-capability.ts >/dev/null
          git ls-files --error-unmatch src/app/api/admin/demo-email-capability/route.ts >/dev/null

      - name: Verify exact production database target
        shell: bash
        env:
          WORKFLOW_DATABASE_OWNER_URL: ${{ secrets.WORKFLOW_DATABASE_OWNER_URL }}
        run: |
          set -euo pipefail
          command -v psql >/dev/null
          database_host="$(
            DATABASE_URL="$WORKFLOW_DATABASE_OWNER_URL" node --input-type=module --eval='
              const value = process.env.DATABASE_URL;
              if (!value) process.exit(1);
              process.stdout.write(new URL(value).hostname);
            '
          )"
          if [[ "$database_host" != "ep-summer-cake-audzi8ve.c-10.us-east-1.aws.neon.tech" ]]; then
            echo "Refusing to run against an unexpected Neon endpoint." >&2
            exit 1
          fi
          database_identity="$(
            psql "$WORKFLOW_DATABASE_OWNER_URL" \
              --no-psqlrc \
              --set=ON_ERROR_STOP=1 \
              --tuples-only \
              --no-align \
              --field-separator='|' \
              --command='SELECT current_database(), session_user;'
          )"
          if [[ "$database_identity" != "neondb|neondb_owner" ]]; then
            echo "Refusing to run against an unexpected database or role." >&2
            exit 1
          fi
          echo "Verified the pinned production database and owner role."

      - name: Enqueue and run the bounded demo
        id: enqueue
        shell: bash
        env:
          WORKFLOW_DATABASE_OWNER_URL: ${{ secrets.WORKFLOW_DATABASE_OWNER_URL }}
        run: |
          set -euo pipefail
          eligible_office_count="$(
            psql "$WORKFLOW_DATABASE_OWNER_URL" \
              --no-psqlrc \
              --set=ON_ERROR_STOP=1 \
              --tuples-only \
              --no-align \
              --command='
                SELECT count(*)
                FROM (
                  SELECT "officeId"
                  FROM "EmailAccount"
                  WHERE provider = '\''GMAIL_APP_PASSWORD'\''
                    AND "credentialSecret" IS NOT NULL
                    AND "isActive" = true
                    AND "sendEnabled" = true
                    AND EXISTS (
                      SELECT 1
                      FROM "Company"
                      WHERE "Company"."officeId" = "EmailAccount"."officeId"
                        AND "Company".name = '\''HypnoDreamz'\''
                    )
                  GROUP BY "officeId"
                  HAVING count(*) = 6
                ) eligible;
              '
          )"
          if [[ "$eligible_office_count" != "1" ]]; then
            echo "Expected exactly one HypnoDreamz office with exactly six eligible Gmail app-password accounts." >&2
            exit 1
          fi

          office_id="$(
            psql "$WORKFLOW_DATABASE_OWNER_URL" \
              --no-psqlrc \
              --set=ON_ERROR_STOP=1 \
              --tuples-only \
              --no-align \
              --command='
                SELECT "officeId"
                FROM "EmailAccount"
                WHERE provider = '\''GMAIL_APP_PASSWORD'\''
                  AND "credentialSecret" IS NOT NULL
                  AND "isActive" = true
                  AND "sendEnabled" = true
                  AND EXISTS (
                    SELECT 1
                    FROM "Company"
                    WHERE "Company"."officeId" = "EmailAccount"."officeId"
                      AND "Company".name = '\''HypnoDreamz'\''
                  )
                GROUP BY "officeId"
                HAVING count(*) = 6;
              '
          )"
          account_ids="$(
            psql "$WORKFLOW_DATABASE_OWNER_URL" \
              --no-psqlrc \
              --set=ON_ERROR_STOP=1 \
              --tuples-only \
              --no-align \
              --set=office_id="$office_id" \
              --file=- <<'SQL'
          SELECT json_agg(id ORDER BY "createdAt", email)::text
          FROM "EmailAccount"
          WHERE "officeId" = :'office_id'
            AND provider = 'GMAIL_APP_PASSWORD'
            AND "credentialSecret" IS NOT NULL
            AND "isActive" = true
            AND "sendEnabled" = true;
          SQL
          )"
          run_id="$(node --input-type=module --eval='import { randomUUID } from "node:crypto"; process.stdout.write(randomUUID().replaceAll("-", ""));')"
          job_id="demo-email-capability-$run_id"
          run_key="email-demo-$run_id"
          trigger_token="$(node --input-type=module --eval='import { randomBytes } from "node:crypto"; process.stdout.write(randomBytes(32).toString("hex"));')"
          trigger_hash="$(TRIGGER_TOKEN="$trigger_token" node --input-type=module --eval='import { createHash } from "node:crypto"; process.stdout.write(createHash("sha256").update(process.env.TRIGGER_TOKEN).digest("hex"));')"
          echo "::add-mask::$trigger_token"

          inserted="$(
            psql "$WORKFLOW_DATABASE_OWNER_URL" \
              --no-psqlrc \
              --set=ON_ERROR_STOP=1 \
              --tuples-only \
              --no-align \
              --quiet \
              --set=job_id="$job_id" \
              --set=office_id="$office_id" \
              --set=account_ids="$account_ids" \
              --set=run_key="$run_key" \
              --set=trigger_hash="$trigger_hash" \
              --set=workflow_actor="$GITHUB_ACTOR" \
              --set=workflow_run_id="$GITHUB_RUN_ID" \
              --set=workflow_run_attempt="$GITHUB_RUN_ATTEMPT" \
              --set=workflow_ref="$GITHUB_REF" \
              --set=workflow_sha="$GITHUB_SHA" \
              --file=- <<'SQL'
          INSERT INTO "BackgroundJob" (
            id, "officeId", type, status, payload, "dedupeKey", attempts,
            "maxAttempts", "runAfter", "createdAt", "updatedAt"
          ) VALUES (
            :'job_id', :'office_id', 'DEMO_EMAIL_CAPABILITY_TEST', 'QUEUED',
            jsonb_build_object(
              'accountIds', :'account_ids'::jsonb,
              'runKey', :'run_key',
              'triggerTokenHash', :'trigger_hash',
              'approvalContext', jsonb_build_object(
                'actor', :'workflow_actor',
                'runId', :'workflow_run_id',
                'runAttempt', :'workflow_run_attempt',
                'ref', :'workflow_ref',
                'sha', :'workflow_sha'
              ),
              'testOnly', true
            ),
            :'run_key', 0, 1, now(), now(), now()
          )
          RETURNING id;
          SQL
          )"
          if [[ "$inserted" != "$job_id" ]]; then
            echo "The demo background job was not created exactly once." >&2
            exit 1
          fi
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "Queued one test-only run for six connected accounts."

          request_body="$(jq -n --arg jobId "$job_id" --arg token "$trigger_token" '{jobId: $jobId, token: $token}')"
          http_status="$(
            curl \
              --silent \
              --show-error \
              --output demo-response.json \
              --write-out '%{http_code}' \
              --request POST \
              --header 'content-type: application/json' \
              --max-time 300 \
              --data "$request_body" \
              "$PRODUCTION_APP_URL/api/admin/demo-email-capability"
          )"
          jq '{accepted, outcome, status, error}' demo-response.json || true
          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "The deployed demo endpoint returned HTTP $http_status." >&2
            exit 1
          fi

      - name: Print the stored demo result
        shell: bash
        env:
          WORKFLOW_DATABASE_OWNER_URL: ${{ secrets.WORKFLOW_DATABASE_OWNER_URL }}
          JOB_ID: ${{ steps.enqueue.outputs.job_id }}
        run: |
          set -euo pipefail
          status="$(
            psql "$WORKFLOW_DATABASE_OWNER_URL" \
              --no-psqlrc \
              --set=ON_ERROR_STOP=1 \
              --tuples-only \
              --no-align \
              --set=job_id="$JOB_ID" \
              --file=- <<'SQL'
          SELECT status FROM "BackgroundJob" WHERE id = :'job_id';
          SQL
          )"
          psql "$WORKFLOW_DATABASE_OWNER_URL" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align \
            --field-separator='|' \
            --set=job_id="$JOB_ID" \
            --file=- <<'SQL'
          SELECT
            status,
            payload #>> '{result,accountCount}',
            payload #>> '{result,passed}',
            payload #>> '{result,failed}',
            payload #>> '{result,completedAt}'
          FROM "BackgroundJob"
          WHERE id = :'job_id';
          SQL
          if [[ "$status" != "DONE" ]]; then
            psql "$WORKFLOW_DATABASE_OWNER_URL" \
              --no-psqlrc \
              --set=ON_ERROR_STOP=1 \
              --set=job_id="$JOB_ID" \
              --file=- <<'SQL'
          SELECT status, "lastError" FROM "BackgroundJob" WHERE id = :'job_id';
          SQL
            exit 1
          fi

  inspect-demo:
    if: ${{ github.ref == 'refs/heads/main' && inputs.inspection_job_id != '' && inputs.reconciliation_job_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: Production
    env:
      REQUEST_CONFIRMATION: ${{ inputs.confirmation }}
      INSPECTION_JOB_ID: ${{ inputs.inspection_job_id }}
      PGOPTIONS: -c lock_timeout=5000 -c statement_timeout=120000 -c idle_in_transaction_session_timeout=120000
    steps:
      - name: Validate inspection request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REQUEST_CONFIRMATION" != "INSPECT_DEMO_EMAIL_CAPABILITY_TEST" ]]; then
            echo "The inspection confirmation phrase is incorrect." >&2
            exit 1
          fi
          if [[ ! "$INSPECTION_JOB_ID" =~ ^demo-email-capability-[a-f0-9]{32}$ ]]; then
            echo "The inspection job ID is invalid." >&2
            exit 1
          fi

      - name: Print sanitized stored result
        shell: bash
        env:
          WORKFLOW_DATABASE_OWNER_URL: ${{ secrets.WORKFLOW_DATABASE_OWNER_URL }}
        run: |
          set -euo pipefail
          command -v psql >/dev/null
          database_host="$(
            DATABASE_URL="$WORKFLOW_DATABASE_OWNER_URL" node --input-type=module --eval='
              const value = process.env.DATABASE_URL;
              if (!value) process.exit(1);
              process.stdout.write(new URL(value).hostname);
            '
          )"
          if [[ "$database_host" != "ep-summer-cake-audzi8ve.c-10.us-east-1.aws.neon.tech" ]]; then
            echo "Refusing to inspect an unexpected Neon endpoint." >&2
            exit 1
          fi
          database_identity="$(
            psql "$WORKFLOW_DATABASE_OWNER_URL" \
              --no-psqlrc \
              --set=ON_ERROR_STOP=1 \
              --tuples-only \
              --no-align \
              --field-separator='|' \
              --command='SELECT current_database(), session_user;'
          )"
          if [[ "$database_identity" != "neondb|neondb_owner" ]]; then
            echo "Refusing to inspect an unexpected database or role." >&2
            exit 1
          fi

          job_summary="$(
            psql "$WORKFLOW_DATABASE_OWNER_URL" \
              --no-psqlrc \
              --set=ON_ERROR_STOP=1 \
              --tuples-only \
              --no-align \
              --field-separator='|' \
              --set=job_id="$INSPECTION_JOB_ID" \
              --file=- <<'SQL'
          SELECT
            type,
            status,
            payload #>> '{result,accountCount}',
            payload #>> '{result,passed}',
            payload #>> '{result,failed}',
            payload #>> '{result,completedAt}'
          FROM "BackgroundJob"
          WHERE id = :'job_id'
            AND type = 'DEMO_EMAIL_CAPABILITY_TEST';
          SQL
          )"
          if [[ -z "$job_summary" ]]; then
            echo "The requested demo job was not found." >&2
            exit 1
          fi
          echo "job=$job_summary"

          echo "conversations:"
          psql "$WORKFLOW_DATABASE_OWNER_URL" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align \
            --field-separator='|' \
            --set=job_id="$INSPECTION_JOB_ID" \
            --file=- <<'SQL'
          SELECT
            conversation.ordinality,
            conversation.value->>'label',
            conversation.value->>'kind',
            conversation.value->>'status',
            coalesce(
              nullif((
                SELECT account."displayName"
                FROM "EmailAccount" AS account
                WHERE account."officeId" = job."officeId"
                  AND lower(account.email) = lower(conversation.value->>'sender')
                LIMIT 1
              ), ''),
              'Connected mailbox'
            ),
            coalesce(
              nullif((
                SELECT account."displayName"
                FROM "EmailAccount" AS account
                WHERE account."officeId" = job."officeId"
                  AND lower(account.email) = lower(conversation.value->>'recipient')
                LIMIT 1
              ), ''),
              'Connected mailbox'
            ),
            CASE
              WHEN conversation.value->>'sentReceivedAt' IS NULL THEN 'INITIAL_NOT_OBSERVED'
              ELSE 'INITIAL_OBSERVED'
            END,
            CASE
              WHEN conversation.value->>'replyReceivedAt' IS NULL THEN 'REPLY_NOT_OBSERVED'
              ELSE 'REPLY_OBSERVED'
            END,
            left(
              regexp_replace(
                replace(coalesce(conversation.value->>'error', ''), E'\n', ' '),
                '[^[:space:]]+@[^[:space:]]+',
                '[mailbox]',
                'g'
              ),
              500
            )
          FROM "BackgroundJob" AS job
          CROSS JOIN LATERAL jsonb_array_elements(job.payload #> '{result,conversations}')
            WITH ORDINALITY AS conversation(value, ordinality)
          WHERE job.id = :'job_id'
            AND job.type = 'DEMO_EMAIL_CAPABILITY_TEST'
          ORDER BY conversation.ordinality;
          SQL

          echo "delivery_events:"
          psql "$WORKFLOW_DATABASE_OWNER_URL" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align \
            --field-separator='|' \
            --set=job_id="$INSPECTION_JOB_ID" \
            --file=- <<'SQL'
          WITH demo_task AS (
            SELECT payload #>> '{result,executionTaskId}' AS task_id
            FROM "BackgroundJob"
            WHERE id = :'job_id'
              AND type = 'DEMO_EMAIL_CAPABILITY_TEST'
          )
          SELECT event."eventType", event.status, count(*)
          FROM "SupplyExecutionEvent" AS event
          JOIN demo_task ON demo_task.task_id = event."executionTaskId"
          WHERE event."eventType" LIKE 'DEMO_EMAIL_DELIVERY_%'
          GROUP BY event."eventType", event.status
          ORDER BY event."eventType", event.status;
          SQL

          echo "delivery_visibility_now:"
          psql "$WORKFLOW_DATABASE_OWNER_URL" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align \
            --field-separator='|' \
            --set=job_id="$INSPECTION_JOB_ID" \
            --file=- <<'SQL'
          WITH demo_task AS (
            SELECT payload #>> '{result,executionTaskId}' AS task_id
            FROM "BackgroundJob"
            WHERE id = :'job_id'
              AND type = 'DEMO_EMAIL_CAPABILITY_TEST'
          ), acknowledged AS (
            SELECT
              event."officeId",
              event."idempotencyKey",
              event.payload
            FROM "SupplyExecutionEvent" AS event
            JOIN demo_task ON demo_task.task_id = event."executionTaskId"
            WHERE event."eventType" = 'DEMO_EMAIL_DELIVERY_ACKNOWLEDGED'
          )
          SELECT
            split_part(acknowledged."idempotencyKey", ':', 3),
            acknowledged.payload->>'stage',
            coalesce(nullif(sender."displayName", ''), 'Connected mailbox'),
            coalesce(nullif(receiver."displayName", ''), 'Connected mailbox'),
            CASE
              WHEN EXISTS (
                SELECT 1
                FROM "EmailMessage" AS message
                JOIN "EmailThread" AS thread ON thread.id = message."threadId"
                WHERE thread."officeId" = acknowledged."officeId"
                  AND message."accountId" = acknowledged.payload->>'receiverAccountId'
                  AND message.direction = 'INBOUND'
                  AND message."rfcMessageId" = ANY (ARRAY[
                    acknowledged.payload->>'intendedMessageId',
                    acknowledged.payload->>'providerMessageId'
                  ])
              ) THEN 'OBSERVED_NOW'
              ELSE 'NOT_OBSERVED_NOW'
            END
          FROM acknowledged
          LEFT JOIN "EmailAccount" AS sender
            ON sender.id = acknowledged.payload->>'senderAccountId'
           AND sender."officeId" = acknowledged."officeId"
          LEFT JOIN "EmailAccount" AS receiver
            ON receiver.id = acknowledged.payload->>'receiverAccountId'
           AND receiver."officeId" = acknowledged."officeId"
          ORDER BY
            split_part(acknowledged."idempotencyKey", ':', 3)::integer,
            acknowledged.payload->>'stage';
          SQL

  reconcile-demo:
    if: ${{ github.ref == 'refs/heads/main' && inputs.reconciliation_job_id != '' && inputs.inspection_job_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Production
    env:
      REQUEST_CONFIRMATION: ${{ inputs.confirmation }}
      RECONCILIATION_JOB_ID: ${{ inputs.reconciliation_job_id }}
      PRODUCTION_APP_URL: https://app.derya.ai
      PGOPTIONS: -c lock_timeout=5000 -c statement_timeout=120000 -c idle_in_transaction_session_timeout=120000
    steps:
      - name: Validate reconciliation request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REQUEST_CONFIRMATION" != "RECONCILE_DEMO_EMAIL_CAPABILITY_TEST" ]]; then
            echo "The reconciliation confirmation phrase is incorrect." >&2
            exit 1
          fi
          if [[ ! "$RECONCILIATION_JOB_ID" =~ ^demo-email-capability-[a-f0-9]{32}$ ]]; then
            echo "The reconciliation job ID is invalid." >&2
            exit 1
          fi

      - name: Authorize and run no-send IMAP reconciliation
        shell: bash
        env:
          WORKFLOW_DATABASE_OWNER_URL: ${{ secrets.WORKFLOW_DATABASE_OWNER_URL }}
        run: |
          set -euo pipefail
          command -v psql >/dev/null
          database_host="$(
            DATABASE_URL="$WORKFLOW_DATABASE_OWNER_URL" node --input-type=module --eval='
              const value = process.env.DATABASE_URL;
              if (!value) process.exit(1);
              process.stdout.write(new URL(value).hostname);
            '
          )"
          if [[ "$database_host" != "ep-summer-cake-audzi8ve.c-10.us-east-1.aws.neon.tech" ]]; then
            echo "Refusing to reconcile against an unexpected Neon endpoint." >&2
            exit 1
          fi
          database_identity="$(
            psql "$WORKFLOW_DATABASE_OWNER_URL" \
              --no-psqlrc \
              --set=ON_ERROR_STOP=1 \
              --tuples-only \
              --no-align \
              --field-separator='|' \
              --command='SELECT current_database(), session_user;'
          )"
          if [[ "$database_identity" != "neondb|neondb_owner" ]]; then
            echo "Refusing to reconcile an unexpected database or role." >&2
            exit 1
          fi

          reconciliation_token="$(node --input-type=module --eval='import { randomBytes } from "node:crypto"; process.stdout.write(randomBytes(32).toString("hex"));')"
          reconciliation_hash="$(RECONCILIATION_TOKEN="$reconciliation_token" node --input-type=module --eval='import { createHash } from "node:crypto"; process.stdout.write(createHash("sha256").update(process.env.RECONCILIATION_TOKEN).digest("hex"));')"
          echo "::add-mask::$reconciliation_token"
          authorized="$(
            psql "$WORKFLOW_DATABASE_OWNER_URL" \
              --no-psqlrc \
              --set=ON_ERROR_STOP=1 \
              --tuples-only \
              --no-align \
              --quiet \
              --set=job_id="$RECONCILIATION_JOB_ID" \
              --set=reconciliation_hash="$reconciliation_hash" \
              --file=- <<'SQL'
          UPDATE "BackgroundJob"
          SET
            payload = payload || jsonb_build_object('reconciliationTokenHash', :'reconciliation_hash'),
            "updatedAt" = now()
          WHERE id = :'job_id'
            AND type = 'DEMO_EMAIL_CAPABILITY_TEST'
            AND status IN ('DONE', 'FAILED')
          RETURNING id;
          SQL
          )"
          if [[ "$authorized" != "$RECONCILIATION_JOB_ID" ]]; then
            echo "The completed demo job was not authorized for reconciliation." >&2
            exit 1
          fi

          request_body="$(jq -n --arg jobId "$RECONCILIATION_JOB_ID" --arg token "$reconciliation_token" '{jobId: $jobId, token: $token, mode: "reconcile"}')"
          http_status="$(
            curl \
              --silent \
              --show-error \
              --output reconciliation-response.json \
              --write-out '%{http_code}' \
              --request POST \
              --header 'content-type: application/json' \
              --max-time 300 \
              --data "$request_body" \
              "$PRODUCTION_APP_URL/api/admin/demo-email-capability"
          )"
          jq '{accepted, outcome, status, result, error}' reconciliation-response.json || true
          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "The deployed reconciliation endpoint returned HTTP $http_status." >&2
            exit 1
          fi
          jq --exit-status '
            .accepted == true
            and .outcome == "reconciled"
            and .result.diagnosticComplete == true
            and .result.acknowledged > 0
            and .result.syncFailures == 0
            and (
              .result.observedBefore == .result.acknowledged
              or (
                (.result.searchedMailboxKinds | index("INBOX")) != null
                and (.result.searchedMailboxKinds | index("ALL")) != null
                and (.result.searchedMailboxKinds | index("JUNK")) != null
              )
            )
          ' reconciliation-response.json >/dev/null
