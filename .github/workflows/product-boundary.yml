name: Product boundary

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  retired-product-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://derya_build:derya_build@127.0.0.1:5432/derya_build
      DATABASE_URL_UNPOOLED: postgresql://derya_build:derya_build@127.0.0.1:5432/derya_build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require enforcement files
        run: |
          test -f docs/PRODUCT_COPY_POLICY.md
          test -f scripts/product-copy-policy.test.ts
          test -f scripts/retired-product-boundary.test.ts
      - name: Install dependencies
        run: npm ci
      - name: Check retired product boundary
        run: npm run test:retirement-boundary
      - name: Check product copy
        run: npm run check:product-copy
