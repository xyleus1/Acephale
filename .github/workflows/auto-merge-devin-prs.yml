# Requires "Allow auto-merge" in repo Settings > General.
# Deleting this file disables this behavior.
name: Auto-merge Devin PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled]

permissions:
  pull-requests: write
  contents: write

jobs:
  enable-auto-merge:
    if: github.event.pull_request.user.login == 'devin-ai-integration[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Enable native auto-merge
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
