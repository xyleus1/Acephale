name: Supply OS tests

on:
  pull_request:
    paths:
      - ".github/workflows/supply-os-tests.yml"
      - "package.json"
      - "package-lock.json"
      - "prisma/**"
      - "scripts/supply-os-*"
      - "scripts/state-recheck.test.ts"
      - "scripts/outreach-campaign-*.test.ts"
      - "scripts/fixtures/**"
      - "src/app/api/supply-os/**"
      - "src/app/dashboard/supply-os/**"
      - "src/lib/company-context.ts"
      - "src/lib/outreach-campaign-*.ts"
      - "src/lib/supply-os/**"
      - "src/app/api/cron/outreach-campaigns/**"
      - "src/app/api/cron/outreach-replies/**"
      - "src/app/api/health/**"
      - "src/app/api/ops/outreach/**"
      - "src/lib/outreach-readiness.ts"
      - "src/lib/migration-manifest.ts"
      - "scripts/migration-manifest*"
      - "scripts/outreach-readiness*"
  push:
    branches: [main]
    paths:
      - ".github/workflows/supply-os-tests.yml"
      - "package.json"
      - "package-lock.json"
      - "prisma/**"
      - "scripts/supply-os-*"
      - "scripts/state-recheck.test.ts"
      - "scripts/outreach-campaign-*.test.ts"
      - "scripts/fixtures/**"
      - "src/app/api/supply-os/**"
      - "src/app/dashboard/supply-os/**"
      - "src/lib/company-context.ts"
      - "src/lib/outreach-campaign-*.ts"
      - "src/lib/supply-os/**"
      - "src/app/api/cron/outreach-campaigns/**"
      - "src/app/api/cron/outreach-replies/**"
      - "src/app/api/health/**"
      - "src/app/api/ops/outreach/**"
      - "src/lib/outreach-readiness.ts"
      - "src/lib/migration-manifest.ts"
      - "scripts/migration-manifest*"
      - "scripts/outreach-readiness*"

permissions:
  contents: read

concurrency:
  group: supply-os-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: derya_supply_os_execution_verify_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d derya_supply_os_execution_verify_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/derya_supply_os_execution_verify_ci?schema=public
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/derya_supply_os_execution_verify_ci?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run Supply OS persistence contracts
        run: |
          npm run test:supply-os-persistence
          npm run test:supply-os-workspace-management
          npm run test:supply-os-workspace-management-db
          npm run test:supply-os-sourcing-persistence
          npm run test:supply-os-planning-persistence
          npm run test:supply-os-execution
          npm run test:supply-os-context-db

      - name: Run the state recheck suite
        env:
          STATE_RECHECK_REPEATS: "2"
        run: npm run test:state-recheck

      - name: Run Context contracts
        run: |
          npm run test:supply-os-context
          npm run test:supply-os-context-documents
          npm run test:supply-os-supplier-email-provider

      - name: Run deterministic sourcing regressions
        run: |
          npm run test:supply-os-csv-route-contract
          npm run test:supply-os-csv-import
          npm run test:supply-os-bom-acceptance
          npm run test:supply-os-sourcing-projection
          npm run test:supply-os-panel-alerts
          npm run test:supply-os-research-route-lifecycle
          npm run test:supply-os-research-worker-lifecycle
          npm run test:supply-os-supplier-research-polling
          npm run test:supply-os-supplier-leads
          npm run test:supply-os-supplier-eval
          npm run test:supply-os-continuous-sourcing
          npm run test:supply-os-atlas-sourcing
          npm run test:supply-os-saved-research-retry
          npm run test:outreach-campaign-copy
          npm run test:outreach-recipient-quality
          npm run test:batch-review
          npm run test:outreach-campaign-send
          npm run test:outreach-campaign-follow-ups
          npm run test:migration-manifest
          npm run test:outreach-readiness
          npm run test:outreach-campaign-planning-db
          npm run test:outreach-campaign-readiness-db
          npm run test:email-delivery-feedback
          npm run test:supply-os-supplier-research-failures
          npm run test:supply-os-supply-intelligence
          npm run test:supply-os-exa-retrieval
          npm run test:supply-os-openai-retrieval
