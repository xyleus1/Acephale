name: Acephale research tests

on:
  pull_request:
  push:
    branches: [main, codex/acephale-standalone, codex/predictor-lora-v1]

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      ACEPHALE_TEST_DATABASE_URL: postgresql://acephale_owner:fixture@127.0.0.1:5432/acephale_ci
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
        env:
          POSTGRES_USER: acephale_owner
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: acephale_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acephale_owner -d acephale_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.12.14"
          enable-cache: true
          cache-dependency-glob: research/acephale/uv.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: uv sync --frozen --extra analysis --group dev
        working-directory: research/acephale
      - run: |
          psql "$ACEPHALE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f services/acephale-runtime/schema.sql
          psql "$ACEPHALE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f services/acephale-runtime/migrations/002-episodic-memory.sql
      - run: npm run check
      - run: npm test
      - run: npm run lint
      - run: uv run --frozen --extra analysis pytest
        working-directory: research/acephale
      - name: Verify public trainer permissions in Docker
        env:
          ACEPHALE_TEST_DOCKER_PERMISSIONS: "1"
        run: |
          docker pull python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
          research/acephale/.venv/bin/python -m pytest research/acephale/tests/test_trainer_image_permissions.py -q
      - run: uv run --frozen --extra analysis acephale --help
        working-directory: research/acephale
      - run: uv run --frozen --extra analysis ruff check src tests
        working-directory: research/acephale
      - run: research/acephale/.venv/bin/python -m pytest infra/acephale-infra-v1 -q
