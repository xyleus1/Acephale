[project]
name = "goalspec"
version = "0.1.0"
description = "Endpoint-conditioned tool prediction with leakage-safe trajectory replay"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.10,<3",
    "numpy>=2.0,<3",
    "jsonschema>=4.23,<5",
    "typer>=0.15,<1",
    "rfc8785==0.1.4",
]

[project.optional-dependencies]
models = ["litellm>=1.60,<2", "faiss-cpu>=1.10,<2"]
analysis = ["duckdb>=1.2,<2", "pyarrow>=19,<24", "matplotlib>=3.10,<4"]
observability = ["opentelemetry-sdk>=1.30,<2", "langfuse>=3,<4", "wandb>=0.19,<1"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
goalspec = "goalspec.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
