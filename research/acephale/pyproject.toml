[project]
name = "acephale"
version = "0.1.0"
description = "Goal-conditioned speculative tool execution with fixed model weights"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.10,<3",
    "numpy>=2.0,<3",
    "jsonschema>=4.23,<5",
    "rfc8785==0.1.4",
]

[project.optional-dependencies]
analysis = ["duckdb>=1.2,<2", "pyarrow>=19,<24", "matplotlib>=3.10,<4"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
acephale = "acephale.infra_cli:main"
acephale-train = "acephale.training_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
