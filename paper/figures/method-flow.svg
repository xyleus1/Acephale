<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-label="Acephale methods flow"><style>text{font-family:Arial,sans-serif;fill:#162438}.box{fill:#f3f6fa;stroke:#536579;stroke-width:1.5}.edge{stroke:#536579;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#536579"/></marker></defs><rect width="1000" height="340" fill="white"/><text x="30" y="35" font-size="22">Goal-conditioned prediction with isolated read execution</text><g font-size="16" text-anchor="middle"><rect class="box" x="30" y="70" width="200" height="70" rx="5"/><text x="130" y="100">Public checkpoint</text><text x="130" y="123">and frozen memory</text><rect class="box" x="285" y="70" width="200" height="70" rx="5"/><text x="385" y="100">Source-bound goals</text><text x="385" y="123">and candidate ranking</text><rect class="box" x="540" y="70" width="200" height="70" rx="5"/><text x="640" y="100">Deployment-specific</text><text x="640" y="123">read admission</text><rect class="box" x="790" y="70" width="180" height="70" rx="5"/><text x="880" y="100">Isolated speculative</text><text x="880" y="123">read + validation</text><rect class="box" x="285" y="215" width="200" height="70" rx="5"/><text x="385" y="245">Unchanged actor</text><text x="385" y="268">generates exact call</text><rect class="box" x="790" y="215" width="180" height="70" rx="5"/><text x="880" y="245">Consume only after</text><text x="880" y="268">exact match + checks</text></g><path class="edge" d="M230 105H280M485 105H535M740 105H785M880 140V210M485 250H785M130 140V250H280"/><text x="530" y="235" font-size="14">Authoritative request</text><text x="30" y="320" font-size="14">Prediction quality, prefix timing and task-level outcomes are evaluated separately.</text></svg>